<style>

.app{min-height:100vh;display:flex}.side{position:fixed;left:0;top:0;bottom:0;width:235px;background:#151927;color:#fff;padding:22px 14px}.logo{font-size:24px;font-weight:800;padding:0 12px 25px}.logo span{color:#8d87ff}.nav button{width:100%;background:none;border:0;color:#bdc4d2;text-align:left;padding:12px;border-radius:10px;margin:2px 0;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#282e40;color:#fff}.main{margin-left:235px;width:calc(100% - 235px);padding:30px;max-width:1450px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.btn{background:var(--accent);border:0;color:#fff;padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer}.btn.secondary{background:#eeedff;color:#5049c9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(17,24,39,.035)}.label{color:var(--muted);font-size:13px}.metric{font-size:25px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}.section{margin-top:16px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card h2{font-size:17px;margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.tag{background:#eeedff;color:#514bd0;border-radius:999px;padding:4px 8px;font-size:12px}.insight{padding:13px;background:#f8f8ff;border-radius:12px;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar .input{min-width:0;flex:1 1 260px}.toolbar .select{flex:0 1 190px}.input,.select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px}.tablewrap{overflow:visible}.table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted)}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);border-radius:99px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;overflow:auto;z-index:1000}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:22px;max-width:900px;width:100%;max-height:calc(100vh - 40px);overflow:auto}.drop{border:2px dashed #ccd2df;border-radius:14px;padding:28px;text-align:center}.small{font-size:12px;color:var(--muted)}

.analysis-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}

.chart-track{height:12px;border-radius:99px;background:#edf0f5;overflow:hidden}.chart-fill{height:100%;border-radius:99px;background:var(--accent)}

.month-bar{width:min(42px,80%);min-height:3px;background:var(--accent);border-radius:7px 7px 0 0;position:relative}.month-bar-col .small{font-size:11px;text-align:center}.month-bar-value{font-size:10px;color:var(--muted);white-space:nowrap}
.analysis-table{width:100%;border-collapse:collapse;font-size:13px}.analysis-table th,.analysis-table td{padding:10px 7px;text-align:left;border-bottom:1px solid var(--line)}.analysis-table th{color:var(--muted);font-weight:600}.analysis-table td:last-child,.analysis-table th:last-child{text-align:right}
.budget-input{width:110px;max-width:100%;padding:7px;border:1px solid var(--line);border-radius:8px}

<body>
<div class="app">
<aside class="side"><div class="logo">Fin<span>AI</span></div><div style="font-size:11px;color:#aeb6c6;padding:0 12px 16px">Gratuita · Dados privados</div><nav class="nav">
<button class="active" data-p="dashboard">🏠 Dashboard</button>
<button data-p="transactions">💳 Transações</button>
<button data-p="analysis">📊 Análise</button>
<button data-p="investments">📈 Investimentos</button>
<button data-p="goals">🎯 Objetivos</button>
</nav></aside>
<main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="modalbox">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">📥 Importar e validar extratos</h2><button class="btn secondary" onclick="closeModal()">✕</button></div>
<p class="sub">Selecione um ou vários ficheiros. O FinAI analisa os valores antes de os guardar.</p>
<div class="drop">
<input id="csv" type="file" accept=".csv,.txt,.xlsx,.xls" multiple onchange="updateSelectedFiles()">
<p class="small">CSV e Excel (.xlsx/.xls)</p>
<div id="selectedFiles" class="selected-files"></div>
<div style="display:flex;justify-content:center;margin-top:10px"><button type="button" class="btn danger" id="clearUploadBtn" onclick="clearSelectedFiles()" style="display:none">🗑️ Apagar ficheiros selecionados</button></div>
</div>
<div id="importStatus" style="margin-top:12px"></div><div id="importPreview" style="margin-top:12px"></div>
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="importBtn" onclick="importFiles()">Analisar ficheiros</button></div>
</div></div>
<input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this)">

<script>
let tx=JSON.parse(localStorage.getItem("finai_tx")||"null");
if(!Array.isArray(tx)) tx=[];
let assets=JSON.parse(localStorage.getItem("finai_assets")||"null");
if(!Array.isArray(assets)) assets=[];
let goals=JSON.parse(localStorage.getItem("finai_goals")||"null");
if(!Array.isArray(goals)) goals=[];
let budgets=JSON.parse(localStorage.getItem("finai_budgets")||"{}");
if(!budgets||typeof budgets!=="object"||Array.isArray(budgets))budgets={};
let editingAsset = null;
let editingGoal = null;
function save(){localStorage.setItem("finai_tx",JSON.stringify(tx));localStorage.setItem("finai_assets",JSON.stringify(assets));localStorage.setItem("finai_goals",JSON.stringify(goals))}
function eur(n){return new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(n)}
function month(d){return String(d).slice(0,7)}
function absSum(a){return a.reduce((s,x)=>s+Math.abs(Number(x.amount)||0),0)}
function exp(a){return a.filter(x=>Number(x.amount)<0)}
function inc(a){return a.filter(x=>Number(x.amount)>0)}
function head(title,sub,action=""){return `<div class="top"><div><div class="title">${title}</div><div class="sub">${sub}</div></div>${action}</div>`}

let reportMonth = localStorage.getItem("finai_report_month") || "";
let reportCompare = JSON.parse(localStorage.getItem("finai_report_compare") || "null");

function availableMonths(){
 return [...new Set(tx.map(x=>month(x.date)).filter(Boolean))].sort().reverse();
}
function ensureReportSelection(){
 const ms=availableMonths();
 if(!ms.length){reportMonth="";reportCompare=[];return}
 if(!ms.includes(reportMonth)) reportMonth=ms[0];
 if(!Array.isArray(reportCompare) || !reportCompare.length) reportCompare=ms.filter(x=>x!==reportMonth).slice(0,6);
 reportCompare=reportCompare.filter(x=>x!==reportMonth && ms.includes(x));
}
function setReportMonth(v){
 reportMonth=v;
 const ms=availableMonths();
 reportCompare=ms.filter(x=>x!==reportMonth).slice(0,6);
 localStorage.setItem("finai_report_month",reportMonth);
 localStorage.setItem("finai_report_compare",JSON.stringify(reportCompare));
 render(window.finaiCurrentPage||"dashboard");
}
function toggleCompareMonth(v, checked){
 if(checked){if(!reportCompare.includes(v))reportCompare.push(v)}
 else reportCompare=reportCompare.filter(x=>x!==v);
 localStorage.setItem("finai_report_compare",JSON.stringify(reportCompare));
 render("analysis");
}
function monthPicker(page){
 const ms=availableMonths();ensureReportSelection();
 return `<div class="toolbar" style="align-items:center;margin-bottom:14px">
 <label class="small"><b>Mês analisado</b></label>
 <select class="select" onchange="setReportMonth(this.value)">
 ${ms.map(m=>`<option value="${m}" ${m==reportMonth?"selected":""}>${m}</option>`).join("")}
 </select>
 ${page==="dashboard"?`<span class="small">Os indicadores e insights abaixo usam este mês.</span>`:""}
 </div>`;
}
function comparisonAverage(baseMonth, subcategory){
 const selected=reportCompare.filter(m=>m!==baseMonth);
 const vals=selected.map(pm=>absSum(exp(tx.filter(x=>month(x.date)==pm && x.subcategory==subcategory))));
 return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
}
function comparisonMonthsUI(){
 const ms=availableMonths();
 return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
 <div><h2 style="margin:0">Comparar com outros meses</h2><div class="small">Escolha quais meses entram na média de comparação.</div></div>
 <button class="btn secondary" onclick="reportCompare=[];localStorage.setItem('finai_report_compare','[]');render('analysis')">Limpar</button>
 </div>
 <div class="toolbar" style="margin-top:10px">${ms.filter(m=>m!==reportMonth).map(m=>`<label class="tag" style="cursor:pointer"><input type="checkbox" ${reportCompare.includes(m)?"checked":""} onchange="toggleCompareMonth('${m}',this.checked)"> ${m}</label>`).join("")}</div>
 </div>`;
}
function driveCard(){
 const client=localStorage.getItem("finai_google_client_id")||"";
 return `<div class="section card drive-panel"><h2>☁️ Cópia privada no Google Drive</h2><p class="sub">Guarda os dados em quatro ficheiros separados na tua conta Google. A sincronização só acontece quando carregas nos botões; não é automática.</p><div class="drive-grid"><div><label class="small" for="driveClientId">Google OAuth Client ID</label><input class="input" id="driveClientId" style="width:100%;margin-top:5px" placeholder="Termina em .apps.googleusercontent.com" value="${escapeHtml(client)}"></div><button class="btn secondary" onclick="saveDriveClientId()">Guardar ID</button></div><div class="drive-actions"><button class="btn" onclick="driveConnectAndUpload()">⬆️ Enviar dados para Drive</button><button class="btn secondary" onclick="driveConnectAndDownload()">⬇️ Restaurar dados do Drive</button></div><div class="drive-status" id="driveStatus">Os dados atuais continuam guardados neste navegador até enviares uma cópia.</div><p class="small">Ficheiros: Transações e orçamentos · Classificações aprendidas · Investimentos · Objetivos. O FinAI não envia dados para o GitHub. Usa apenas a permissão de ficheiros que esta aplicação criar.</p></div>`;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function saveDriveClientId(){const el=document.getElementById("driveClientId");if(!el)return;const id=el.value.trim();if(!id){alert("Cola primeiro o Google OAuth Client ID.");return}localStorage.setItem("finai_google_client_id",id);driveStatus("ID guardado neste navegador.")}
function driveStatus(msg){const el=document.getElementById("driveStatus");if(el)el.textContent=msg}
let finaiDriveTokenClient=null, finaiDriveAccessToken=null;
function loadGoogleIdentity(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2){resolve();return}const script=document.createElement("script");script.src="https://accounts.google.com/gsi/client";script.onload=resolve;script.onerror=()=>reject(new Error("Não foi possível carregar o acesso Google. Verifica a ligação à Internet."));document.head.appendChild(script)})}
async function getDriveToken(){
 const id=(localStorage.getItem("finai_google_client_id")||document.getElementById("driveClientId")?.value||"").trim();
 if(!id){throw new Error("Falta o Google OAuth Client ID. Guarda-o no campo acima.")}
 localStorage.setItem("finai_google_client_id",id); await loadGoogleIdentity();
 return new Promise((resolve,reject)=>{try{finaiDriveTokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:"https://www.googleapis.com/auth/drive.file",callback:(r)=>{if(r.error){reject(new Error(r.error_description||r.error));return}finaiDriveAccessToken=r.access_token;resolve(r.access_token)}});finaiDriveTokenClient.requestAccessToken({prompt:"consent"})}catch(e){reject(e)}})
}
async function driveApi(url,opts={}){const r=await fetch(url,{...opts,headers:{Authorization:`Bearer ${finaiDriveAccessToken}`,...(opts.headers||{})}});if(!r.ok){let detail="";try{detail=(await r.json()).error?.message||""}catch{}throw new Error(detail||`Erro Google Drive (${r.status})`)}return r.status===204?null:r.json()}
async function driveFindOrCreateFolder(){const q=encodeURIComponent("name='FinAI' and mimeType='application/vnd.google-apps.folder' and trashed=false");const found=await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=100`);if(found.files?.length)return found.files[0].id;const folder=await driveApi("https://www.googleapis.com/drive/v3/files?fields=id,name",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"FinAI",mimeType:"application/vnd.google-apps.folder"})});return folder.id}
async function driveListFolderFiles(folderId){const q=encodeURIComponent(`'${folderId}' in parents and trashed=false`);const d=await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType)&pageSize=100`);return d.files||[]}
async function driveWriteFile(folderId,files,name,content){const existing=files.find(f=>f.name===name);const metadata={name,mimeType:"application/json"};const boundary="finai_boundary_"+Math.random().toString(36).slice(2);const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(content,null,2)}\r\n--${boundary}--`;
 let url,method;if(existing){url=`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart&fields=id,name`;method="PATCH"}else{metadata.parents=[folderId];url="https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name";method="POST"}
 return driveApi(url,{method,headers:{"Content-Type":`multipart/related; boundary=${boundary}`},body});}
async function driveReadFile(file){return driveApi(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`)}
function driveDataParts(){return [
 {name:"01_Transacoes_e_Orcamentos.json",data:{finai_tx:localStorage.getItem("finai_tx"),finai_budgets:localStorage.getItem("finai_budgets"),finai_report_month:localStorage.getItem("finai_report_month"),finai_report_compare:localStorage.getItem("finai_report_compare")}},
 {name:"02_Classificacoes_Aprendidas.json",data:{finai_rules:localStorage.getItem("finai_rules")}},
 {name:"03_Investimentos.json",data:{finai_assets:localStorage.getItem("finai_assets")}},
 {name:"04_Objetivos.json",data:{finai_goals:localStorage.getItem("finai_goals")}}
]}
async function driveConnectAndUpload(){try{driveStatus("A ligar à conta Google…");await getDriveToken();driveStatus("A preparar a pasta FinAI…");const folder=await driveFindOrCreateFolder();const files=await driveListFolderFiles(folder);for(const part of driveDataParts()){await driveWriteFile(folder,files,part.name,{app:"FinAI",formatVersion:1,updatedAt:new Date().toISOString(),data:part.data});}driveStatus("Cópia enviada. Foram guardados 4 ficheiros na pasta FinAI do teu Google Drive.");alert("Cópia enviada para o Google Drive. Os teus dados locais não foram apagados.")}catch(e){driveStatus("Não foi possível enviar: "+e.message);alert("Erro ao enviar para o Google Drive: "+e.message+"\n\nSe for a primeira configuração, confirma o Client ID, a Google Drive API e a origem autorizada no Google Cloud.")}}

function ruleText(s){

  .replace(/[^a-z0-9]+/g," ").replace(/\b(transacao por|transação por|emitida por|emitido por|cartao de debito|cartao de credito|cartao|debit|credit|pos|terminal|compra|pagamento)\b/g," ")

  .replace(/\b\d{4,}\b/g," ").replace(/\s+/g," ").trim();
}
function merchantRuleKey(s){
 const c=cleanMerchant(s);

function findSavedMerchantRule(raw, merchant, rules){
 const candidates=[merchantRuleKey(merchant),merchantRuleKey(cleanMerchant(raw)),ruleText(merchant),ruleText(raw)].filter(Boolean);
 const entries=Object.entries(rules||{});
 for(const candidate of candidates){
  const found=entries.find(([k])=>ruleText(k)===candidate);
  if(found) return found[1];
 }
 // Backward-compatible matching for classifications learned in previous FinAI versions.
 for(const [k,v] of entries){
  const key=ruleText(k); if(key.length<6) continue;
  if(candidates.some(c=>c===key || c.includes(" "+key+" ") || c.startsWith(key+" ") || c.endsWith(" "+key))) return v;
 }
 return null;
}
function sameMerchantTransaction(a, key){

 return candidates.some(c=>c===key || (key.length>=6 && (c.startsWith(key+" ")||key.startsWith(c+" "))));
}

function parseClassificationCsv(text){
 const first=(text.split(/\r?\n/).find(x=>x.trim())||"");
 const delimiter=(first.split(";").length>first.split(",").length)?";":(first.split("\t").length>first.split(",").length?"\t":",");
 const matrix=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"') {if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}
  else if(ch===delimiter&&!quoted){row.push(field);field="";}
  else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(field);if(row.some(v=>String(v).trim()))matrix.push(row);row=[];field="";}
  else field+=ch;
 }
 if(field.length||row.length){row.push(field);if(row.some(v=>String(v).trim()))matrix.push(row);}
 if(!matrix.length)return[];
 const norm=v=>String(v||"").replace(/^\uFEFF/,"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"").trim();
 const headers=matrix[0].map(norm);
 const pick=(names)=>headers.findIndex(h=>names.includes(h));
 const mi=pick(["comerciante","merchant","fornecedor","nomecomerciante","nomeloja","loja"]);
 const ci=pick(["categoria","category"]);const si=pick(["subcategoria","subcategory"]);
 if(mi<0||ci<0||si<0)throw new Error("O CSV precisa de colunas Comerciante, Categoria e Subcategoria (ou Merchant, Category e Subcategory).");
 return matrix.slice(1).map(r=>({merchant:String(r[mi]||"").trim(),category:String(r[ci]||"").trim(),subcategory:String(r[si]||"").trim()})).filter(r=>r.merchant&&r.category&&r.subcategory);
}
async function importClassificationsFile(input){

 try{
  const entries=parseClassificationCsv(await file.text());if(!entries.length)throw new Error("O ficheiro não contém classificações válidas.");
  const allowed=["Casa","Alimentação","Transportes","Lazer","Shopping","Saúde","Profissional","Financeiro","Viagens","Doações","Receitas","Serviços","Outros"];
  const rules=JSON.parse(localStorage.getItem("finai_rules")||"{}");let imported=0,applied=0;
  for(const e of entries){
   const category=allowed.find(v=>aiKey(v)===aiKey(e.category));if(!category)continue;
   const displayName=String(cleanMerchant(e.merchant)||e.merchant).trim();const key=merchantRuleKey(displayName);if(key.length<3)continue;
   const rule={category,subcategory:e.subcategory.trim(),merchantName:displayName,updatedAt:new Date().toISOString()};
   rules[key]=rule;rules[ruleText(displayName)]=rule;imported++;
   for(const y of tx){
    if(!sameMerchantTransaction(y,key))continue;
    if(y.manuallyConfirmed&&!needsClassificationHelp(y))continue;
    y.category=rule.category;y.subcategory=rule.subcategory;y.merchant=rule.merchantName||y.merchant;
    y.classificationMethod="Memória";y.aiConfidence="Muito alta";y.manuallyConfirmed=true;applied++;
   }
  }
  if(!imported)throw new Error("Não encontrei categorias válidas no ficheiro.");
  localStorage.setItem("finai_rules",JSON.stringify(rules));save();input.value="";render("transactions");
  alert(`Importação concluída: ${imported} regras de memória guardadas e ${applied} transações classificadas. As regras serão usadas nas próximas importações.`);
 }catch(err){alert("Não consegui importar as classificações: "+(err&&err.message?err.message:String(err)));input.value="";}
}

 };

}

function cleanMerchant(s){
 const original=String(s||"").trim();
 // Keep the installment number visible and preserve the contract in the original description.
 const installment=original.match(/\bPrestação\s*n[ºo°]?\s*(\d+)\s*-?\s*Contrato\s*([\w-]+)/i);
 if(installment) return `Prestação nº ${installment[1]}`;
 let candidate=original;
 // Portuguese card statements often place the actual supplier after “Transação por cartão ... emitida por”.
 // Extract this BEFORE stripping card metadata; otherwise the old cleanup removed the entire supplier name.
 if(/^\s*transa[cç][aã]o\s+por\b/i.test(original)){
   const emitted=original.match(/\bemitid[ao]\s+por\s+(.+?)(?=\s+-\s*(?:cart[aã]o|terminal)\b|\s*$)/i);
   if(emitted&&emitted[1]) candidate=emitted[1].trim();
 }
 let t=candidate.toUpperCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  // Remove known bank/card suffixes only; never remove everything after the word CARTAO in the full description.
  .replace(/\s+-\s*(?:CARTAO|TERMINAL)\b.*$/i,"")
  .replace(/\s+\bCARTAO\s+\d{4,}\s*$/i,"")
  .replace(/\s+\b(?:REF|REFERENCIA|NR|NIF)\s*[:#-]?\s*[\w.-]+\s*$/i,"")
  .replace(/\b\d{4,}\b/g," ")
  .replace(/\s+/g," ").trim();
 const aliases=[
  [/CONFEITARIA\s*SANTIAGO/,"Confeitaria Santiago"],[/CONFEITARIA\s*RIAN/,"Confeitaria Rian"],[/^FLIXBUS\b/,"FlixBus"],[/^FLIXTRAIN\b/,"FlixTrain"],[/^FLIX\b/,"Flix"],
  [/TORRES\s*&?\s*VAZ/,"Torres & Vaz (Galp)"],[/LAGE\s*SENHOR\s*PADRAO|REST\s*LAGE\s*SENHOR/,"Restaurante Lage Senhor do Padrão"],[/LA\s*BOCCA\s*DOLCE/,"La Bocca Dolce"],[/MO\s*MAIA\s*JARDIM/,"MO Maia Jardim"],[/CARTORIO\s*NOTARIAL/,"Cartório Notarial"],
  [/MANTEIGARIA/,"Manteigaria"],[/TUTTO\s*ITALIA/,"Tutto Italia"],[/FLOATINGLICIOUS/,"Floatinglicious"],[/JD\s*SPORTS/,"JD Sports"],[/PLANTHIZA/,"Planthiza"],[/SR\s*FRANGO\s*DA\s*GUIA/,"Sr. Frango da Guia"],[/LA\s*PARRILLA/,"La Parrilla"],[/MISTER\s*CHURRASCO/,"Mister Churrasco"],[/MOONA\s*CHICKEN/,"Moona Chicken"],[/NINKI/,"Ninki Sushi Bar"],[/ARC[AÁ]DIA/,"Arcádia"],[/BOKKUSU/,"Bokkusu"],[/MADEMOISELLE/,"Mademoiselle"],[/SOCOVIRA/,"Socovira"],[/NORAUTO/,"Norauto"],[/FEU\s*VERT/,"Feu Vert"],[/JOP\s*PORTO/,"JOP"],[/PAPEL\s*AMANHECER/,"Papel Amanhecer"],[/CASA\s*DO\s*MAR/,"Casa do Mar"],[/DREAM\s*VERSION/,"Dream Version"],[/FEIRA\s*VIVA/,"Feira Viva"],[/GRUPO\s*GOLGOTA/,"Grupo Gólgota"],[/A\s*SUPER\s*2000/,"A Super 2000"],
  [/EASY\s*POSITANO/,"Easy Positano"],[/MARCELLO\s*S\s*GELATERIA/,"Marcello S Gelateria"],[/SOUVENIR\s*DAL\s*1972/,"Souvenir Dal 1972"],[/CHIOSCO\s*TIZZANO/,"Chiosco Tizzano"],[/FOCACCIA\s*LAB/,"Focaccia Lab Capri"],[/RANTEVOU\s*BAKERY/,"Rantevou Bakery"],[/KOUTSIOGANNAKI\s*IRINI/,"Koutsogiannaki Irini"],
  [/MERCADONA/,"Mercadona"],[/PINGO\s*DOCE/,"Pingo Doce"],[/CONTINENTE/,"Continente"],[/LIDL/,"Lidl"],[/ALDI/,"Aldi"],[/AUCHAN/,"Auchan"],[/INTERMARCHE/,"Intermarché"],[/MINIPRECO/,"Minipreço"],
  [/ENDESA/,"Endesa"],[/EDP/,"EDP"],[/GALP\s*ENERGIA/,"Galp Energia"],[/MEO/,"MEO"],[/NOS\b/,"NOS"],[/VODAFONE/,"Vodafone"],
  [/VIA\s*VERDE/,"Via Verde"],[/UBER\s*EATS/,"Uber Eats"],[/UBER/,"Uber"],[/BOLT/,"Bolt"],[/GLOVO/,"Glovo"],
  [/NETFLIX/,"Netflix"],[/SPOTIFY/,"Spotify"],[/DISNEY/,"Disney+"],[/AMAZON/,"Amazon"],[/ZARA/,"Zara"],[/PRIMARK/,"Primark"],[/DECATHLON/,"Decathlon"],[/FNAC/,"FNAC"],
  [/PAYPAL/,"PayPal"],[/ORDEM\s+DOS\s+ENGENHEIROS/,"Ordem dos Engenheiros"],[/FARMACIA/,"Farmácia"],
  [/GENERALI/,"Generali"],[/MCDONALD/,"McDonald's"],[/BURGER\s*KING/,"Burger King"],[/STARBUCK/,"Starbucks"]
 ];
 for(const [rx,name] of aliases)if(rx.test(t))return name;
 return t.replace(/\s*-\s*.*$/," ").trim()||original;
}

function normalizeHeader(s){
 return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\s_\-\/]+/g," ").trim();
}
function findHeader(headers, variants){
 const hs=headers.map(normalizeHeader);
 for(const v of variants){const i=hs.indexOf(normalizeHeader(v));if(i>=0)return headers[i]}
 for(let i=0;i<hs.length;i++)for(const v of variants)if(hs[i].includes(normalizeHeader(v)))return headers[i];
 return null;
}
function parseMoney(raw){
 if(raw==null||raw==="")return null;
 let s=String(raw).trim().replace(/\s/g,"").replace(/[€$£]/g,"");
 if(s.includes(",")&&s.includes(".")){
   if(s.lastIndexOf(",")>s.lastIndexOf("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");
 }else if(s.includes(","))s=s.replace(",",".");
 s=s.replace(/[^\d.+-]/g,"");const n=Number(s);return Number.isFinite(n)?n:null;
}
function normalizeDate(raw){
 if(raw==null||raw==="")return "";
 if(typeof raw==="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(raw);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}
 let s=String(raw).trim(),m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
 if(m){let y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}
 let d=new Date(s);return isNaN(d) ? s : d.toISOString().slice(0,10);
}
function detectSchema(headers){
 return {
  date:findHeader(headers,["date","data","data movimento","data valor","transaction date","date of transaction"]),
  description:findHeader(headers,["description","descricao","descrição","descrição movimento","details","merchant","nome","movimento","referencia","referência"]),
  amount:findHeader(headers,["amount","valor","valor movimento","transaction amount","montante"]),
  debit:findHeader(headers,["debit","debito","débito","withdrawal","saida","saída"]),
  credit:findHeader(headers,["credit","credito","crédito","deposit","entrada","receita"]),
  account:findHeader(headers,["account","conta","account name","iban"])
 };
}
function rowsFromObjects(rows,fileName){
 if(!rows.length)return{rows:[],error:"Sem linhas"};
 // Some bank spreadsheets have title/metadata rows before the real header.
 let headerIndex=-1, schema=null;
 const scan=Math.min(rows.length,40);
 for(let i=0;i<scan;i++){
   const hs=Object.keys(rows[i]||{});
   const candidate=detectSchema(hs);
   if(candidate.date&&candidate.description&&(candidate.amount||candidate.debit||candidate.credit)){headerIndex=i;schema=candidate;break}
 }
 if(headerIndex<0){
   // Try rows represented as arrays via a secondary path.
   return{rows:[],error:"Não consegui localizar automaticamente a linha de cabeçalho com data, descrição e valor."};
 }
 // Rows before the detected header are metadata and are ignored.
 const data=rows.slice(headerIndex+1);
 const headers=Object.keys(rows[headerIndex]);
 const sc=schema;
 const accountFromFile=(fileName.match(/^(.*?)\s*[-_]/)||[])[1]||fileName.replace(/\.[^.]+$/,"");
 const out=[];
 for(const o of data){
   const date=normalizeDate(o[sc.date]),desc=String(o[sc.description]??"").trim();
   if(!date||!desc)continue;
   let amount=null;
   if(sc.amount)amount=parseMoney(o[sc.amount]);
   else{
     const debit=parseMoney(o[sc.debit]),credit=parseMoney(o[sc.credit]);
     if(debit!==null&&debit!==0)amount=-Math.abs(debit);
     else if(credit!==null&&credit!==0)amount=Math.abs(credit);
     else amount=0;
   }
   if(amount===null)continue;
   let [cat,sub,merchant,method,confidence]=classify(desc);
   if(cat==="Receitas")amount=Math.abs(amount);
   const account=String(o[sc.account]||accountFromFile||"Conta principal").trim();
   out.push({date,description:desc,merchant:merchant||desc,amount,category:cat,subcategory:sub,account,sourceFile:fileName,aiConfidence:confidence||((cat==="Outros")?"Baixa":(method==="Personalizada"?"Muito alta":"Alta")),classificationMethod:method,manuallyConfirmed:false});
 }
 return{rows:out,error:null};
}
function rowsFromArrayRows(matrix,fileName){
 if(!matrix||!matrix.length)return{rows:[],error:"Folha vazia"};
 for(let hi=0;hi<Math.min(matrix.length,40);hi++){
   const headers=(matrix[hi]||[]).map(x=>String(x??"").trim());
   const sc=detectSchema(headers);
   if(sc.date&&sc.description&&(sc.amount||sc.debit||sc.credit)){
     const objs=matrix.slice(hi+1).map(row=>{const o={};headers.forEach((h,i)=>o[h]=row[i]??"");return o});
     return rowsFromObjects([Object.fromEntries(headers.map(h=>[h,h])),...objs],fileName);
   }
 }
 return{rows:[],error:"Não consegui localizar a linha de cabeçalho."};
}
function waitForUI(){return new Promise(resolve=>setTimeout(resolve,30))}
function parseExcelInWorker(file){
 return new Promise(async (resolve,reject)=>{
   let worker=null,timer=null,finished=false;
   const finish=(fn,value)=>{if(finished)return;finished=true;if(timer)clearTimeout(timer);if(worker)worker.terminate();fn(value)};
   try{
     const buffer=await file.arrayBuffer();
     const workerCode=`
       self.importScripts("https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js");
       self.onmessage=function(e){
         try{
           const wb=XLSX.read(e.data,{type:"array",cellDates:false});
           const sheets=wb.SheetNames.map(name=>({name,matrix:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:true})}));
           self.postMessage({ok:true,sheets});
         }catch(err){self.postMessage({ok:false,error:String(err&&err.message||err)})}
       };
     `;
     worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:"application/javascript"})));
     timer=setTimeout(()=>finish(reject,new Error("A leitura do Excel demorou demasiado tempo.")),15000);
     worker.onmessage=e=>{
       if(e.data&&e.data.ok)finish(resolve,e.data.sheets);
       else finish(reject,new Error(e.data?.error||"Não foi possível ler o Excel."));
     };
     worker.onerror=e=>finish(reject,new Error(e.message||"Erro ao ler o Excel."));
     worker.postMessage(buffer,[buffer]);
   }catch(err){finish(reject,err)}
 });
}
async function parseFile(file){
 const ext=file.name.toLowerCase().split(".").pop();
 if(ext==="csv"||ext==="txt")return parseCSVText(await file.text(),file.name);
 if((ext==="xlsx"||ext==="xls")&&window.XLSX){
   try{
     const sheets=await parseExcelInWorker(file),all=[],errors=[];
     for(const sheet of sheets){
       const r=rowsFromArrayRows(sheet.matrix,file.name+" / "+sheet.name);
       if(!r.error)all.push(...r.rows); else errors.push(sheet.name+": "+r.error);
     }
     return all.length?{rows:all,error:null}:{rows:[],error:errors.join("<br>")||"Não encontrei dados transacionais."};
   }catch(err){return{rows:[],error:err.message||"Não foi possível ler o Excel."}}
 }
 return{rows:[],error:"Formato não suportado. Use CSV ou Excel (.xlsx/.xls)."};
}

function renderImportReview(preserveScroll=true){

 const confirmed=pendingImport.filter(x=>reviewLevel(x)!=="normal"&&x.reviewed).length;

 const selectedCount=filtered.filter(x=>x._selected).length;

 document.getElementById("importStatus").innerHTML=`<div class="review-summary"><div class="review-box"><span class="small">Novas</span><b>${total}</b></div><div class="review-box"><span class="small">Normais</span><b class="green">${normal}</b></div><div class="review-box clickable ${importReviewFilter==="warning"?"active":""}" onclick="toggleReviewFilter('warning')" title="Mostrar apenas valores acima de €500 pendentes"><span class="small">⚠️ &gt; €500 pendentes</span><b class="orange">${warning}</b></div><div class="review-box"><span class="small">🔴 Críticas pendentes</span><b class="red">${critical}</b></div></div>${confirmed?`<div class="small" style="margin-top:8px">✅ ${confirmed} valor(es) de risco já confirmado(s).</div>`:""}${filterControls}`;
 const emptyMessage=importReviewFilter==="warning"&&filtered.length===0?`<div class="insight"><b>🎉 Não existem valores &gt; €500 pendentes.</b><br>Todos os valores deste filtro já foram confirmados.</div>`:"";

 const reviewMessage=reviewed?`<div style="margin-top:6px"><b class="green">✅ Valor confirmado</b></div>`:(msg?`<div style="margin-top:6px"><b>${msg}</b></div>`:"");
 const checkbox=(l==="warning"&&!reviewed&&importReviewFilter==="warning")?`<input class="review-select" type="checkbox" ${x._selected?"checked":""} onchange="pendingImport[${i}]._selected=this.checked; renderImportReview(false)">`:"";
 const confirmButton=l!=="normal"&&!reviewed?`<button class="btn" type="button" onclick="confirmPendingValue(${i})">✅ Está correto</button>`:(reviewed?`<button class="btn secondary" type="button" disabled>✅ Confirmado</button>`:"");
 return `<div class="review-item ${l==="critical"?"critical":l==="warning"?"warning":""}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="display:flex;gap:9px;align-items:flex-start">${checkbox}<div><b>${x.date}</b> · ${x.description}<div class="small">${x.account||""}</div></div></div><b class="${x.amount<0?"red":"green"}">${x.amount<0?"-":""}${eur(Math.abs(x.amount))}</b></div>${reviewMessage}<div class="review-actions"><button class="btn gray" type="button" onclick="editPending(${i})">✏️ Editar</button><button class="btn danger" type="button" onclick="deletePending(${i})">🗑️ Apagar</button>${confirmButton}</div></div>`}).join("")}</div>`;

 function normalizeDuplicateText(v){
   return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
 }
 function transactionFingerprint(x){
   return normalizeDuplicateText(x.date)+"|"+normalizeDuplicateText(x.description)+"|"+Number(x.amount||0).toFixed(2);
 }
 function installmentFingerprint(x){
   const d=normalizeDuplicateText(x.description);
   const m=d.match(/prestacao\s*n[ºo°]?\s*(\d+)\s*-?\s*contrato\s*([\w-]+)/i);

function cancelGoalEdit(){editingGoal=null;render("goals")}
function saveGoal(event,i){
 event.preventDefault();const f=event.currentTarget;const data=new FormData(f);
 const name=String(data.get("name")||"").trim(),target=Number(data.get("target")),current=Number(data.get("current"));
 if(!name||!Number.isFinite(target)||target<=0||!Number.isFinite(current)||current<0){alert("Verifique o nome do objetivo, o valor da meta e o valor atual.");return}
 goals[i]={...goals[i],name,target,current};editingGoal=null;save();render("goals");
}
function addAsset(){let n=prompt("Nome do ativo:");if(!n)return;let t=prompt("Tipo:","CDB")||"Outro",v=Number(prompt("Valor atual (€):","0"));if(Number.isFinite(v)&&v>=0){assets.push({name:n,type:t,value:v});save();render("investments")}}
function addGoal(){let n=prompt("Objetivo:");if(!n)return;let t=Number(prompt("Meta (€):","10000")),c=Number(prompt("Atual (€):","0"));if(Number.isFinite(t)&&t>0&&Number.isFinite(c)&&c>=0){goals.push({name:n,target:t,current:c});save();render("goals")}}
function repairLegacyTransactionMerchants(){
 let changed=0;
 const generic=/^\s*transa[cç][aã]o\s+por\b/i;
 for(const x of tx){
  if(!generic.test(String(x.merchant||""))) continue;
  const extracted=cleanMerchant(x.description);
  if(!extracted||generic.test(extracted)) continue;
  x.merchant=extracted;
  // Reclassify only unreviewed/low-confidence rows. Preserve any user-confirmed decisions.
  if(!x.manuallyConfirmed&&(!x.category||x.category==="Outros"||x.subcategory==="A identificar"||x.aiConfidence==="Baixa")){
   const [category,subcategory,merchant,method,confidence]=classify(x.description);
   x.category=category; x.subcategory=subcategory; x.merchant=merchant||extracted;
   x.classificationMethod=method; x.aiConfidence=confidence||"Baixa";
  }
  changed++;
 }
 if(changed) save();
 return changed;
}
// Repair legacy imported rows on startup, without deleting transactions or overwriting confirmed categories.
repairLegacyTransactionMerchants();
render();
